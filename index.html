<title>Painel Operacional</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html,
    body {
        width: 100%;
        height: 100%;
        background-color: #000;
    }

    body {
        overflow: hidden;
    }

    #painel {
        position: fixed;
        top: 0;
        left: 0;

        width: 100vw;
        height: 100vh;

        display: block;

        object-fit: contain;

        background-color: #000;
    }
</style>
