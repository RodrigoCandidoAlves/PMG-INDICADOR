<!DOCTYPE html> <html lang="pt-BR"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Operacional</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html,
    body {
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
    }

    body {
        display: flex;
        justify-content: center;
        align-items: center;
    }

    #painel {
        width: 100vw;
        height: 100vh;
        object-fit: contain;
        display: block;
    }
</style>

</head> <body>
<img
    id="painel"
    src="./slide1.png"
    alt="Painel Operacional"
>

<script>

    // =========================================================
    // LISTA DE SLIDES
    // =========================================================

    const slides = [
        "./slide1.png",
        "./slide2.png",
        "./slide3.png",
        "./slide4.png",
        "./slide5.png",
        "./slide6.png"
    ];


    // =========================================================
    // ELEMENTO DO PAINEL
    // =========================================================

    const painel = document.getElementById("painel");

    let atual = 0;


    // =========================================================
    // PRÉ-CARREGAMENTO DAS IMAGENS
    // =========================================================

    slides.forEach(function(slide) {

        const img = new Image();

        img.src = slide;

    });


    // =========================================================
    // TROCA DE SLIDE
    // =========================================================

    function trocarSlide() {

        atual++;

        if (atual >= slides.length) {

            atual = 0;

        }

        painel.src = slides[atual];

    }


    // =========================================================
    // TROCA A CADA 10 SEGUNDOS
    // =========================================================

    setInterval(trocarSlide, 10000);


    // =========================================================
    // MANTÉM A PÁGINA ATIVA
    // Atualiza o título a cada 30 segundos
    // =========================================================

    setInterval(function() {

        document.title =
            "Painel Operacional - " +
            new Date().toLocaleTimeString("pt-BR");

    }, 30000);


    // =========================================================
    // QUANDO A PÁGINA VOLTAR A FICAR VISÍVEL
    // =========================================================

    document.addEventListener(
        "visibilitychange",
        function() {

            if (!document.hidden) {

                painel.src = slides[atual];

            }

        }
    );


    // =========================================================
    // TRATAMENTO DE ERRO
    // Se uma imagem não carregar, tenta voltar para o slide 1
    // =========================================================

    painel.addEventListener("error", function() {

        console.error(
            "Erro ao carregar a imagem:",
            painel.src
        );

        painel.src = "./slide1.png";

    });

</script>

</body> </html>
