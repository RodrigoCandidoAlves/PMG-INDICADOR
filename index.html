<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Painel PMG</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: black;
            overflow: hidden;
        }

        #slide {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }
    </style>
</head>

<body>

    <img id="slide" src="Slide1.png" alt="Slide">

    <script>
        const slides = [
            "Slide1.png",
            "Slide2.PNG",
            "Slide3.PNG",
            "Slide4.PNG",
            "Slide5.PNG",
            "Slide6.png"
        ];

        let atual = 0;

        function trocarSlide() {
            atual++;

            if (atual >= slides.length) {
                atual = 0;
            }

            document.getElementById("slide").src = slides[atual];
        }

        // Troca a cada 10 segundos
        setInterval(trocarSlide, 10000);
    </script>

</body>
</html>
